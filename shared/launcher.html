<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0a1020"><title>Clash Lara</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#25325a,#0a1020 70%);color:#eff3ff;font:15px system-ui,sans-serif;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}.panel{width:min(100%,430px);padding:27px;border:1px solid #b7955e66;border-radius:22px;background:#101a30e8;box-shadow:0 30px 90px #0009}.top{font-size:12px;letter-spacing:2px;color:#e9c690}h1{font-size:42px;margin:12px 0 8px;line-height:1.0}p{color:#b7c7db;line-height:1.5}.btn{width:100%;padding:17px;border:0;border-radius:11px;margin-top:12px;color:#0d1424;background:linear-gradient(115deg,#eac187,#ffe6b2);font-weight:900;cursor:pointer;font-size:14px}.btn.alt{background:#263852;color:#edf2ff;border:1px solid #8193af}.hint{color:#92a6c1;font-size:12px;margin-top:16px}input{width:100%;color:white;padding:15px;border:1px solid #9f896e;background:#0b182c;border-radius:11px;font-size:16px}label{display:block;font-size:12px;margin:20px 0 8px;color:#d9c298}#status{min-height:20px;color:#f5bbad;font-size:12px}</style></head><body><div class="panel"><div class="top">LARA GAMING · V7 BETA</div><h1>RUNE<br>CLASH</h1><p>Uma única aventura com combates por runas. Jogue sem internet ou visite mundos dos amigos pela mesma rede Wi-Fi.</p><button class="btn" onclick="location.href='./game.html'">▶ ENTRAR NO MEU MUNDO OFFLINE</button><label for="host">Endereço HTTPS do anfitrião (Wi-Fi)</label><input id="host" type="url" inputmode="url" autocomplete="url" placeholder="https://192.168.1.23:8787/"/><button class="btn alt" id="connect">◈ CONECTAR AOS AMIGOS</button><p id="status"></p><div class="hint">Multiplayer: servidor Node.js ligado na rede e certificado TLS confiável. Nunca ignoramos avisos de certificado.</div></div><script>
const input=document.querySelector('#host'),status=document.querySelector('#status');const key='runeClashLanHostV7';try{input.value=localStorage.getItem(key)||''}catch{}
function lanOrigin(raw){try{const u=new URL(raw);if(u.protocol!=='https:'||u.username||u.password||u.search||u.hash||(u.pathname!=='/'&&u.pathname!==''))return null;const h=u.hostname.toLowerCase();if(h.endsWith('.local')&&h!=='offline.runeclash.local')return u.origin;const a=h.split('.');if(a.length!==4||a.some(x=>!/^[0-9]{1,3}$/.test(x)||+x>255))return null;const n=a.map(Number);return(n[0]===10||(n[0]===172&&n[1]>=16&&n[1]<=31)||(n[0]===192&&n[1]===168)||n[0]===127)?u.origin:null;}catch{return null}}
document.querySelector('#connect').addEventListener('click',async()=>{const origin=lanOrigin(input.value.trim());if(!origin){status.textContent='Informe HTTPS com IP local privado (ou nome .local), sem caminhos extras.';return;}try{localStorage.setItem(key,origin+'/')}catch{}status.textContent='Abrindo conexão HTTPS…';try{if(window.LaraDesktop?.connectLAN){const ok=await window.LaraDesktop.connectLAN(origin+'/');if(!ok)status.textContent='Falha ao abrir. Confira o certificado do anfitrião.';return;}if(window.Capacitor?.Plugins?.Browser?.open){await window.Capacitor.Plugins.Browser.open({url:origin+'/'});status.textContent='Conexão aberta no navegador seguro.';return;}window.open(origin+'/','_blank','noopener,noreferrer');status.textContent='Se o navegador bloqueou a abertura, copie o endereço e abra no Safari.';}catch{status.textContent='Conexão indisponível. Verifique Wi-Fi e certificado.';}});
</script></body></html>
