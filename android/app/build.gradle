plugins {
    id 'com.android.application'
}
android {
    namespace 'com.lara.runeclash'
    compileSdk 35
    defaultConfig {
        applicationId 'com.lara.runeclash.beta2'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.9.0-etapas-beta'
    }
    buildTypes {
        release {
            minifyEnabled false
            // Sign your release from Android Studio. No signing keys are shipped.
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
