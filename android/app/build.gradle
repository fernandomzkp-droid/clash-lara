plugins {
    id 'com.android.application'
}
android {
    namespace 'com.lara.runeclash'
    compileSdk 35
    defaultConfig {
        applicationId 'com.lara.runeclash.beta2'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '0.9.1-visual-beta'
    }
    signingConfigs {
        debug {
            def betaKey = rootProject.file('../.beta-signing/debug.keystore')
            if (betaKey.exists()) {
                storeFile betaKey
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Sign your release from Android Studio. No signing keys are shipped.
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
