<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Clash Lara — Host Tab S7</title><style>body{font:16px system-ui;background:#101522;color:#f2f4fc;max-width:680px;margin:auto;padding:24px}button,input,select{padding:12px;border-radius:9px;margin:5px;background:#252e44;color:white;border:1px solid #52607b}button{cursor:pointer}section{background:#1b2538;padding:16px;border-radius:16px;margin:14px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#b5c2d7}</style><h1>Clash Lara · Tab S7 Alpha</h1><small>GM e treinador por conta. Rede local; não publicar HTTP na internet.</small><section><h2>Entrar</h2><input id="name" placeholder="Usuário" autocomplete="username"><input id="pass" type="password" placeholder="Senha" autocomplete="current-password"><button onclick="login()">Entrar</button></section><section><h2>Criar conta com convite</h2><input id="newname" placeholder="Novo usuário"><input id="newpass" type="password" placeholder="Nova senha (12+)" ><input id="code" placeholder="Código GM"><button onclick="register()">Cadastrar</button></section><section><h2>Treinador</h2><select id="cls"></select><button onclick="train('select')">Selecionar</button><button onclick="train('start')">Iniciar</button><button onclick="train('pause')">Pausar</button><button onclick="train('status')">Atualizar</button></section><section><h2>GM</h2><button onclick="invites()">Gerar convite</button><small>Somente conta GM</small></section><section><h2>Estado</h2><pre id="out">Aguardando autenticação.</pre></section><script>const classes=['Duelista','Arcanista','Sentinela','Caçador','Assassino','Invocador','Clérigo','Berserker','Monge','Elementalista'];for(const c of classes){const o=document.createElement('option');o.textContent=c;cls.append(o)}let token='';async function api(p,d){try{const r=await fetch('/api/'+p,{method:'POST',headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:JSON.stringify(d)});const x=await r.json();out.textContent=JSON.stringify(x,null,2);return r.ok?x:null}catch(e){out.textContent='Sem conexão: '+e.message;return null}}async function login(){const x=await api('login',{username:name.value,password:pass.value});if(x)token=x.token}function register(){return api('register',{username:newname.value,password:newpass.value,code:code.value})}function train(action){return api('trainer',{action,className:cls.value})}function invites(){return api('invites',{count:1,hours:24})}</script></html>
