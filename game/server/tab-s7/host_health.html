<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clash Lara • Saúde do Host</title><style>body{font:16px system-ui;background:#0b1220;color:#f0f5ff;margin:0}main{max-width:750px;margin:30px auto;padding:22px}.panel{border:1px solid #38506c;background:#142137;padding:20px;border-radius:20px}#metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.metric{padding:16px;border-radius:12px;background:#20334c}.metric b{display:block;font-size:22px;margin-top:8px}p{color:#b9c9df}button{background:#355b89;color:white;border:0;border-radius:9px;padding:12px}</style><main><h1>Clash Lara · Saúde do Host</h1><p>Monitor leve para Galaxy Tab S7. Os dados são amostras do processo Node.js, não um benchmark do aparelho.</p><div class="panel"><p id="status">Aguardando servidor...</p><div id="metrics"></div><p id="note"></p><button id="refresh">Atualizar agora</button></div></main><script>const fields={processRssMb:['RAM do processo','MB'],heapUsedMb:['Heap JavaScript','MB'],systemFreeMb:['RAM livre do sistema','MB'],processCpuPercent:['CPU do processo','%'],eventLoopLagMs:['Atraso do event loop','ms'],uptimeSeconds:['Servidor ativo','s']};let busy=false;async function update(){if(busy||document.hidden)return;busy=true;try{const r=await fetch('/api/host-vitals',{cache:'no-store'});if(!r.ok)throw Error('Servidor indisponível');const x=(await r.json()).host;status.textContent=x.warning==='none'?'Servidor respondendo':'Atenção: pressão de recursos';metrics.replaceChildren();for(const [key,[label,unit]]of Object.entries(fields)){const div=document.createElement('div');div.className='metric';const span=document.createElement('span');span.textContent=label;const b=document.createElement('b');b.textContent=(x[key]??'—')+' '+unit;div.append(span,b);metrics.append(div)}note.textContent='Leituras aproximadas; para temperatura, bateria e FPS são necessárias APIs Android com permissão.'}catch(e){status.textContent=e.message}finally{busy=false}}refresh.onclick=update;document.addEventListener('visibilitychange',()=>{if(!document.hidden)update()});setInterval(update,10000);update();</script></html>
