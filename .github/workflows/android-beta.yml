name: Gerar APK beta Android
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: SDK Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Preparação e testes
        run: npm test
      - name: Compilar APK
        run: gradle -p android --no-daemon assembleDebug
      - name: Verificar assinatura e preparar arquivo
        run: |
          mkdir -p entrega
          cp android/app/build/outputs/apk/debug/app-debug.apk entrega/Clash-Lara-Beta.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose entrega/Clash-Lara-Beta.apk
          cd entrega
          sha256sum Clash-Lara-Beta.apk > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Clash-Lara-Beta-APK
          path: entrega/
          if-no-files-found: error
